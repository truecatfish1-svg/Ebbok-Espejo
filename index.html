<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        function shouldSuppress(message, error) {
          var msgStr = '';
          if (message) {
            msgStr = String(message).toLowerCase();
          } else if (error && error.message) {
            msgStr = String(error.message).toLowerCase();
          } else if (error) {
            msgStr = String(error).toLowerCase();
          }
          if (!msgStr) return false;
          return msgStr.indexOf('browser extension') !== -1 || 
                 msgStr.indexOf('extension') !== -1 || 
                 msgStr.indexOf('uncaught error') !== -1;
        }

        // Add capture listener at window level as early as possible
        window.addEventListener('error', function(e) {
          var msg = e.message || (e.error && e.error.message) || '';
          if (shouldSuppress(msg, e.error)) {
            try {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
            } catch(err) {}
            return true;
          }
        }, true);

        // Also override window.onerror
        var oldOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (shouldSuppress(msg, error)) {
            return true; // Suppress
          }
          if (oldOnError) {
            try {
              return oldOnError.apply(window, arguments);
            } catch(err) {
              return true;
            }
          }
          return false;
        };

        // Suppress unhandled promise rejections as well
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = (reason && (reason.message || reason)) || '';
          if (shouldSuppress(msg, reason)) {
            try {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
            } catch(err) {}
            return true;
          }
        }, true);
      })();
    </script>
